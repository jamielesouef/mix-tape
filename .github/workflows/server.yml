name: Server

# Path filters are the point: a change under App/** must not run this workflow,
# and a change under Shared/** must run BOTH. Shared compiles on the server side
# and the app side, so it is the one tree neither workflow may ignore.
on:
  push:
    branches: [main]
    paths:
      - "Server/**"
      - "Shared/**"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "Server/**"
      - "Shared/**"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/**"
      - ".github/workflows/server.yml"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers
        run: ./scripts/check-spdx.sh
      - name: Layer imports
        run: ./scripts/check-layer-imports.sh

  linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    # The same image the Dockerfile's build stage pins. This job is the binding
    # proof that Shared is Linux-clean, and it is only binding if it compiles
    # under the Swift the shipped image actually carries.
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build Shared
        working-directory: Shared
        run: swift build
      - name: Build and test Server
        working-directory: Server
        run: |
          swift build
          swift test

  image:
    name: Build and push the image
    needs: [checks, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Ladder L2, v1 rung. This one input is the seam: v2 adds a second
          # value here and nothing else in the repository changes.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
