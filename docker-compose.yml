services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - type: bind
        source: ./media
        target: /media
        read_only: true
    restart: unless-stopped

volumes:
  jellyfin-config:
  jellyfin-cache:
